services:
  # El backend de la instancia de dev desde el corte a PostgreSQL.
  #
  # 🔴 La clave del servicio lleva el nombre del producto y no es `db` ni
  # `postgres`: `stack-net` es una red COMPARTIDA por todo el VPS y Compose
  # convierte la clave en un alias de red. Dos composes con la misma clave se
  # turnan por round-robin del DNS interno — ya pasó en esta familia.
  #
  # 🔴 Imagen Debian (`postgres:16`), la misma del CI: el collation viene de la
  # imagen y la alpine ordena por bytes, como SQLite.
  #
  # 🔴 **Dos bases**, creadas por `docker/postgres-init/`: el dominio y
  # LibraCore no pueden compartir schema (ver el comentario de ese .sql).
  #
  # Sin `ports:` a propósito: sólo se llega desde la red interna.
  gestiolibra-postgres:
    image: postgres:16
    container_name: gestiolibra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestiolibra
      POSTGRES_USER: gestiolibra
      # Sin default a propósito: `:?` aborta el `up` si falta, en vez de
      # levantar la base con una clave escrita en git.
      POSTGRES_PASSWORD: ${GESTIOLIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}
    volumes:
      - gestiolibra-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestiolibra -d gestiolibra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datos

  gestiolibra-dev:
    build:
      context: .
      # Un id SSH por paquete privado, igual que los
      # `--mount=type=ssh,id=...` del Dockerfile y que
      # `libracore.provisioning.docker_build_ssh_args()` para el build de
      # producción: GitHub autentica toda la conexión con la primera deploy
      # key que le ofrecen, así que una sola key no alcanza.
      #
      # Declarar sólo `default` (como estaba hasta el 2026-07-28) hacía
      # fallar `docker compose build` al clonar libragenda/libra-ui, así que
      # la imagen de dev no se podía reconstruir y quedó congelada mientras
      # el bind mount `./:/app` seguía trayendo código nuevo — hasta que ese
      # código importó un símbolo que la imagen vieja no tenía y uvicorn
      # dejó de levantar el worker.
      ssh:
        - default=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
        - libracore=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
        - libragenda=${LIBRAGENDA_SSH_KEY:-~/.ssh/id_ed25519_libragenda}
        - libraauth=${LIBRAAUTH_SSH_KEY:-~/.ssh/id_ed25519_libraauth}
        - libra-ui=${LIBRA_UI_SSH_KEY:-~/.ssh/id_ed25519_libra_ui}
    container_name: gestiolibra-dev
    depends_on:
      gestiolibra-postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8075:8000"
    # El bind mount de abajo (necesario para --reload en vivo del codigo
    # Python) taparia el build del frontend si viviera dentro de /app --
    # por eso el Dockerfile lo hornea en /opt/frontend-dist, fuera del
    # arbol montado (ver ADR-022; un volumen anonimo para /app/frontend/dist
    # se probo primero pero Docker solo lo siembra desde la imagen una vez
    # y despues lo congela ahi para siempre, ignorando rebuilds futuros).
    volumes:
      - ./:/app
    command: uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - SECRET_KEY=${SECRET_KEY:-gestiolibra-dev-secret}
      - GESTIOLIBRA_ADMIN_USERNAME=${GESTIOLIBRA_ADMIN_USERNAME:-admin}
      - GESTIOLIBRA_ADMIN_PASSWORD=${GESTIOLIBRA_ADMIN_PASSWORD:-}
      # 🔴 El corte a PostgreSQL. Son DOS bases y no dos schemas de la misma:
      # el dominio (LibraGenda) y LibraCore declaran los dos una tabla
      # `clients` con `id` de tipos incompatibles — ver
      # `docker/postgres-init/10-base-de-libracore.sql`.
      #
      # Volver estas dos líneas a las rutas `.db` y reiniciar es el rollback
      # completo: los archivos de `dev-data/` siguen ahí y sin tocar —
      #   - DATABASE_URL=sqlite:////app/dev-data/gestiolibra.db
      #   - GESTIOLIBRA_LIBRACORE_DB_PATH=/app/dev-data/gestiolibra_libracore.db
      - DATABASE_URL=postgresql+psycopg://gestiolibra:${GESTIOLIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}@gestiolibra-postgres:5432/gestiolibra
      - GESTIOLIBRA_LIBRACORE_DB_PATH=postgresql://gestiolibra:${GESTIOLIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}@gestiolibra-postgres:5432/gestiolibra_core
      # Sin esto la carpeta de backups colgaría de `dirname()` de la URL, que
      # no es una carpeta — ver `_carpeta_de_backups` en app/main.py.
      - DATA_DIR=/app/dev-data
      - ENV=development
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      # Recuperación de contraseña (libraauth v0.5.0). Sin SMTP la app
      # levanta igual y `POST /auth/forgot-password` devuelve 503 — cargar
      # estas variables es lo único que falta para que empiece a mandar
      # mails de verdad.
      - GESTIOLIBRA_RESET_URL_BASE=${GESTIOLIBRA_RESET_URL_BASE:-https://dev.gestiolibra.com.ar/reset-password}
      - LIBRAAUTH_SMTP_HOST=${LIBRAAUTH_SMTP_HOST:-}
      - LIBRAAUTH_SMTP_PORT=${LIBRAAUTH_SMTP_PORT:-587}
      - LIBRAAUTH_SMTP_USER=${LIBRAAUTH_SMTP_USER:-}
      - LIBRAAUTH_SMTP_PASSWORD=${LIBRAAUTH_SMTP_PASSWORD:-}
      - LIBRAAUTH_SMTP_FROM_EMAIL=${LIBRAAUTH_SMTP_FROM_EMAIL:-}
      - LIBRAAUTH_SMTP_FROM_NAME=${LIBRAAUTH_SMTP_FROM_NAME:-Gestiolibra}
    networks:
      - stack-net
      - datos

volumes:
  gestiolibra-postgres-data:

networks:
  datos:
    name: gestiolibra-dev-datos
  stack-net:
    external: true
    name: stack_stack-net
