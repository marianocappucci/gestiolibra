services:
  gestiolibra-dev:
    build:
      context: .
      ssh:
        - default=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
    container_name: gestiolibra-dev
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8075:8000"
    volumes:
      - ./:/app
      # El bind mount de arriba (necesario para --reload en vivo del
      # codigo Python) tapa el frontend/dist ya compilado que quedo
      # horneado en la imagen (el checkout del host no tiene ese build,
      # se genera en el stage de node del Dockerfile) -- este volumen
      # anonimo preserva el contenido de la imagen para ese subpath en
      # vez de mostrar el directorio vacio del host. Ver DECISIONS.md
      # ADR-019/ADR-020.
      - /app/frontend/dist
    command: uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - SECRET_KEY=${SECRET_KEY:-gestiolibra-dev-secret}
      - GESTIOLIBRA_ADMIN_USERNAME=${GESTIOLIBRA_ADMIN_USERNAME:-admin}
      - GESTIOLIBRA_ADMIN_PASSWORD=${GESTIOLIBRA_ADMIN_PASSWORD:-}
      - DATABASE_URL=sqlite:////app/dev-data/gestiolibra.db
      - GESTIOLIBRA_LIBRACORE_DB_PATH=/app/dev-data/gestiolibra_libracore.db
      - ENV=development
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
